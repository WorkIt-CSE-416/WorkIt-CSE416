<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WorkIt Autofiller</title>
    <script src="../shared/tokens.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../../icons/icon.png" alt="" width="20" height="20" />
      <span>WorkIt Autofiller</span>
    </header>

    <main id="root">
      <p class="muted">Loading…</p>
    </main>

    <template id="login-template">
      <p id="signed-out-message">Sign in to WorkIt to use the autofiller.</p>
      <p class="error muted" hidden></p>
      <button type="button" id="open-webapp-button">Sign In at WorkIt</button>
      <button type="button" id="recheck-button" class="secondary">
        I Signed In — Check Again
      </button>
      <p class="hint muted">
        This extension has no sign-in of its own — it uses whichever WorkIt session is already
        open in your browser, however you signed in (password, Google, or LinkedIn).
      </p>
    </template>

    <template id="failed-template">
      <p class="failed" role="alert"></p>
      <button type="button" id="try-again-button">Try again</button>
    </template>

    <template id="signed-in-template">
      <div class="profile">
        <p class="name"></p>
        <p class="email muted"></p>
      </div>
      <section class="unsupported" hidden>
        <p class="unsupported-line">WorkIt can't fill this site yet</p>
        <button type="button" id="save-button">Save to WorkIt</button>
        <button type="button" id="report-button" class="secondary">Report a problem</button>
        <div class="report" hidden>
          <p class="muted">Send report sends only this:</p>
          <ul class="report-parts muted"></ul>
          <button type="button" id="send-report-button">Send report</button>
        </div>
        <p class="said muted" role="status" hidden></p>
      </section>
      <p class="batch-status"></p>
      <button type="button" id="open-workit-button">Open WorkIt</button>
      <p class="hint muted">
        On a job form, WorkIt's panel is at the right edge of the page: this icon and Alt+W open and close it.
      </p>
      <button type="button" id="workday-signup-button" class="secondary">Workday Sign-Up</button>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
