[project]
name = "workit-scraper"
version = "0.1.0"
description = "WorkIt job ingestion: reads employer ATS feeds directly."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
workit-scrape = "workit_scraper.cli:main"

[tool.uv]
# Match backend/pyproject.toml: always a uv-downloaded interpreter, never
# whatever Python happens to be on the machine.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workit_scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# Default tests are offline. Use structural fixtures with invented posting
# content and identities; never commit real captured responses. See CLAUDE.md.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
