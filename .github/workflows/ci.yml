name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - run: uv run ruff check .
      # Real Tectonic for the template text test (KAN-204). The cache key
      # follows the pinned version and the fixed resume, so a change to
      # either warms again; a miss only costs the ~1 minute download.
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: tectonic-${{ hashFiles('backend/scripts/fetch_tectonic.py', 'backend/app/services/resume_render/*.py', 'backend/app/services/resume_render/*.tex') }}
      - run: python3 scripts/fetch_tectonic.py
      - run: uv run pytest
        env:
          # Fail, never skip, the tests that need Tectonic
          REQUIRE_TECTONIC: "1"
      # Scout's package (../scout) is installed here, so it is linted and tested here.
      - run: uv run ruff check ../scout
      - run: uv run pytest ../scout/tests

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      # Stdlib-only package: nothing to install, so ruff and pytest run as one-off tools.
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx pytest -v
