name: Scrape jobs

# Scrapes every job board in scraper/boards.csv and imports the shortlist into
# Supabase's job_postings, every three hours. Root CLAUDE.md's CI section explains
# the schedule, the secret it needs and how it fails.
on:
  schedule:
    # Off the hour: GitHub delays, and under load drops, runs scheduled on it.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Read every board, quiet ones included (scraper --full)"
        type: boolean
        default: false
      dry_run:
        description: "Import with --dry-run: report what would change, write nothing"
        type: boolean
        default: false
  # A change to the scraper, the import or this file runs the whole path once,
  # with the import always a dry run, so it is proven before it merges.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/scrape.yml"
      - "scraper/**"
      - "backend/app/scripts/import_jobs.py"
      - "backend/app/schemas/jobs.py"

# One run at a time: two imports at once would race on the same rows, and two
# scrapes would double the load on every board.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape-and-import:
    runs-on: ubuntu-latest
    # A cancelled run saves no store, so the next one repeats its work: every
    # scheduled run from 2026-10-28 to 10-29 hit 30 minutes reading posting pages
    # and none imported. The scraper now stops starting page reads 20 minutes in
    # (`PAGES_UNTIL_S`), so a run should end near 35 minutes; this is headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # jobs.json is the scraper's memory: first-seen dates, each posting's page,
      # which boards were read when. Without it a run re-reads every Greenhouse
      # page and counts nothing as new. Restore the newest one.
      - name: Restore the scraper's store
        uses: actions/cache/restore@v4
        with:
          path: scraper/jobs.json
          key: scraper-store-${{ github.run_id }}
          restore-keys: scraper-store-

      # Daily discovery proposes additions in a PR. Only the human-reviewed,
      # merged boards.csv is scraped; do not add unreviewed curated leads here.
      # -u: unbuffered, so each board's line shows when it happens. Buffered, the
      # cancelled runs of 2026-10-30 printed lines in batches and lost their last
      # minutes, so the log looked silent where the scraper was still reading.
      - name: Scrape
        working-directory: scraper
        run: python3 -u -m workit_scraper ${{ inputs.full && '--full' || '' }}

      # Saved only after a scrape that finished, so a crashed run can't hand the
      # next one a half-written store.
      - name: Save the scraper's store
        uses: actions/cache/save@v4
        with:
          path: scraper/jobs.json
          key: scraper-store-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the feed and page for a week
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ github.run_id }}
          path: |
            scraper/feed.json
            scraper/closings.json
            scraper/internships.html
            scraper/metrics.json
          retention-days: 7

      - uses: astral-sh/setup-uv@v3

      - name: Install the backend
        working-directory: backend
        run: uv sync --locked

      - name: Import into Supabase
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The model the keyword pass reads (scout/CLAUDE.md): the small
          # chain, then the default chain after it.
          SCOUT_ENDPOINTS_SMALL: ${{ secrets.SCOUT_ENDPOINTS_SMALL }}
          SCOUT_ENDPOINTS: ${{ secrets.SCOUT_ENDPOINTS }}
          DRY_RUN: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && '--dry-run' || '' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # A missing secret arrives as "", which is not unset: Scout's
          # settings refuse "" as a list.
          for name in SCOUT_ENDPOINTS_SMALL SCOUT_ENDPOINTS; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          if [ -z "$SCOUT_ENDPOINTS_SMALL" ] && [ -z "$SCOUT_ENDPOINTS" ]; then
            echo "::warning::No SCOUT_ENDPOINTS_SMALL or SCOUT_ENDPOINTS secret; this run extracts no keywords."
          fi
          uv run python -m app.scripts.import_jobs ../scraper/feed.json ${DRY_RUN:+"$DRY_RUN"}
