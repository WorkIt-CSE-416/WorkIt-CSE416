# The Test Person sample: a made-up applicant, in the shape of
# apply/applicant-profile.template.yaml. Apply copies this folder into an empty
# data folder ($APPLY_HOME, default ~/.config/apply) on its first run, so it
# runs before you add your own files. The person and their stories are invented
# (the school is a real one, so school searches on forms find it).
#
# While sample_data is true, the Apply window says "Sample data", so nothing is
# sent as Test Person by mistake. Put in your own facts, then delete that line.
