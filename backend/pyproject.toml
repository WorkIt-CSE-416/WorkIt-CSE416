[project]
name = "workit-api"
version = "0.1.0"
# Upper bound on purpose. There is no .python-version file, so this is the only
# thing pinning the interpreter: ">=3.12" alone would let one teammate sync onto
# 3.13 and another onto 3.14, which is how a bug appears on exactly one laptop.
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "ftfy>=6.3.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.53",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.53.0",
    "workit-scout",
]

[tool.uv]
# Always use a uv-downloaded interpreter, never whatever Python happens to be on
# the machine. Teammates run Homebrew, Conda and the system Python in various
# combinations; without this, "3.12" silently means a different build for each
# of them. uv fetches the pinned version on first sync.
python-preference = "only-managed"

[tool.vercel]
# Where Vercel finds the ASGI app when this folder is deployed as its own
# project (Root Directory = backend). app/main.py is also on Vercel's
# auto-detect list; this pins it so a new main.py elsewhere can't win.
entrypoint = "app.main:app"

[tool.uv.sources]
# A copy, not editable: Python skips editable installs' .pth files when macOS
# flags them hidden. ../scout/CLAUDE.md has the details.
workit-scout = { path = "../scout" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = ["alembic/versions"]

[tool.ruff.lint]
ignore = ["B008", "BLE001", "SIM103"]
