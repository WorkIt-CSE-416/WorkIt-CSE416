# Alembic configuration.
#
# NO DATABASE URL HERE, DELIBERATELY. This file is committed; the password is
# not. alembic/env.py reads DIRECT_URL through app.config instead. Adding a
# `sqlalchemy.url` line back would both leak the credential and silently
# override the environment.
#
# Stripped to the settings that do something. Every other option Alembic
# supports — file_template, timezone, post-write hooks such as a formatter —
# is documented at https://alembic.sqlalchemy.org/en/latest/config.html

[alembic]
script_location = %(here)s/alembic
# So `from app...` resolves when Alembic executes env.py.
prepend_sys_path = .
path_separator = os

[post_write_hooks]

# Logging. Alembic is quiet at WARNING; INFO on the alembic logger is what
# prints "Running upgrade ..." during a migration.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
